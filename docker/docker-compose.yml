# Shed pilot shape: web + worker + Postgres (system of record) + nightly backup.
# Local dev can still use SQLite: DATABASE_URL=sqlite:////app/data/cmr_cases.db
# Secrets come from the environment (.env file), never committed.

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - HARNESS_HOST=0.0.0.0
      - HARNESS_PORT=8080
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://cmr:${POSTGRES_PASSWORD:-cmr-secret}@db:5432/cmr}
      - HARNESS_DATA_DIR=/app/data
      - INFERENCE_PROVIDER=${INFERENCE_PROVIDER:-openrouter}
      - OPENROUTER_API_URL=${OPENROUTER_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - INFERENCE_API_KEY=${INFERENCE_API_KEY:-}
      - HARNESS_API_KEY=${HARNESS_API_KEY:-cmr-secret-key-2026}
      - TOOL_MODULE_TOKEN=${TOOL_MODULE_TOKEN:-cmr-tool-token-dev}
    volumes:
      - harness_data:/app/data
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "harness.worker.worker"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://cmr:${POSTGRES_PASSWORD:-cmr-secret}@db:5432/cmr}
      - HARNESS_DATA_DIR=/app/data
      - INFERENCE_PROVIDER=${INFERENCE_PROVIDER:-openrouter}
      - OPENROUTER_API_URL=${OPENROUTER_API_URL:-https://openrouter.ai/api/v1/chat/completions}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      - INFERENCE_API_KEY=${INFERENCE_API_KEY:-}
      - TOOL_MODULE_TOKEN=${TOOL_MODULE_TOKEN:-cmr-tool-token-dev}
      - WORKER_POLL_INTERVAL_S=${WORKER_POLL_INTERVAL_S:-2.0}
    volumes:
      - harness_data:/app/data
    depends_on:
      - db
      - web

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cmr
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cmr-secret}
      - POSTGRES_DB=cmr
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backup:
    image: postgres:16-alpine
    command: ["/bin/sh", "-c", "while true; do /backup/nightly_backup.sh; sleep 86400; done"]
    environment:
      - PGHOST=db
      - PGUSER=cmr
      - PGPASSWORD=${POSTGRES_PASSWORD:-cmr-secret}
      - PGDATABASE=cmr
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup/nightly_backup.sh:ro
      - pg_backups:/backups
    depends_on:
      - db

volumes:
  harness_data:
  pg_data:
  pg_backups:
